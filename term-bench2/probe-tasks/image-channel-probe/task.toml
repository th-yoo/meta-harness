[task]
name = "meta-harness/image-channel-probe"
description = "Delivery-channel probe for the rung-5 arm: does an agent under the bench's claude-code driver physically RECEIVE an image it can see? A 6-character token exists only inside /app/token.png -- not in the instruction, any text file, or any filename -- rendered large and high-contrast so that a failure indicts the channel rather than perception. Deliberately trivial to read IF the image arrives; impossible otherwise."
keywords = ["probe", "delivery-channel", "vision", "rung-5"]
