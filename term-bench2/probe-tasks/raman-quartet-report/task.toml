[task]
name = "meta-harness/raman-quartet-report"
description = "Rung 1.5 of the representation-trap ablation ladder, and the MINIMAL fixture the shipped D&C merge machinery can engage. Report the D, G, D-prime and 2D band positions of a graphene Raman spectrum whose data file stores the x axis in wavelength-nm. No fitting required (local argmax suffices); the failure rung is retrieving the canonical band conventions and converting shift = 1e7/x. Four bands because mergeCheck refuses n=3 on asymmetric geometry: conditioningCheck adds its +-1-shift alternates only when n-1 >= 3, so the real operable floor is n=4."
keywords = ["probe", "representation-trap", "physics", "unit-conversion"]
