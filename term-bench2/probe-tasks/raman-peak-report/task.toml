schema_version = "1.1"
artifacts = []

[task]
name = "meta-harness/raman-peak-report"
description = "Minimal reproduction probe for the representation-trap class: report the G peak position of a graphene Raman spectrum whose data file stores the x axis in wavelength-nm. No fitting required (argmax suffices); the only failure rung is retrieving the canonical G-peak convention (~1580 cm^-1) and converting. Derived from terminal-bench/raman-fitting by stripping fitting, the second peak, decimal commas, and descending order."
keywords = ["probe", "representation-trap", "physics", "unit-conversion"]
